<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房產好夥伴雅慈 · 內部工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#EDE7DD;
    --stone-deep:#E1D9C9;
    --ink:#2B2620;
    --ink-soft:#5B5347;
    --jade:#3F5B4F;
    --jade-deep:#2E453B;
    --brass:#B08D57;
    --brass-soft:#D9C5A0;
    --brick:#A8462F;
    --paper:#F7F4EC;
    --line:#D8CFBC;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--stone);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
  }
  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px; flex-shrink:0;
    background:var(--jade-deep);
    color:var(--stone);
    display:flex; flex-direction:column;
    padding:28px 0;
  }
  .brand{
    padding:0 24px 24px;
    border-bottom:1px solid rgba(237,231,221,0.15);
    margin-bottom:12px;
  }
  .brand-mark{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:2px;
    color:var(--brass-soft);
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:3px;
    color:rgba(237,231,221,0.55);
    margin-top:4px;
  }
  .nav{ display:flex; flex-direction:column; margin-top:8px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:13px 24px;
    font-size:14px; font-weight:500;
    color:rgba(237,231,221,0.75);
    cursor:pointer;
    border-left:3px solid transparent;
    transition:all .15s ease;
    user-select:none;
  }
  .nav-item:hover{ background:rgba(237,231,221,0.06); color:var(--stone); }
  .nav-item.active{
    background:rgba(237,231,221,0.09);
    border-left:3px solid var(--brass);
    color:var(--stone);
    font-weight:700;
  }
  .nav-icon{ width:16px; text-align:center; font-size:14px; opacity:.9; }

  .sidebar-foot{
    margin-top:auto; padding:16px 24px 0;
    font-size:11px; color:rgba(237,231,221,0.4);
    border-top:1px solid rgba(237,231,221,0.12);
    padding-top:16px;
  }
  .btn-sidebar{
    width:100%;
    background:rgba(237,231,221,0.08);
    color:var(--stone);
    border:1px solid rgba(237,231,221,0.25);
    padding:9px 12px; border-radius:var(--radius);
    font-size:12px; font-weight:700; cursor:pointer;
    font-family:'Noto Sans TC', sans-serif;
  }
  .btn-sidebar:hover{ background:rgba(237,231,221,0.16); }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:36px 44px; max-width:1180px; }
  .page-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:28px; flex-wrap:wrap; gap:16px;
  }
  .page-title{
    font-family:'Noto Serif TC', serif;
    font-weight:900; font-size:28px; color:var(--ink);
    display:flex; align-items:baseline; gap:10px;
  }
  .page-title .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:2px;
    color:var(--brass); text-transform:uppercase;
    background:var(--brass-soft); padding:3px 8px; border-radius:2px;
  }
  .page-desc{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  .btn{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:var(--radius);
    border:none; cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--jade); color:var(--paper); }
  .btn-primary:hover{ background:var(--jade-deep); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .btn-danger{ background:transparent; color:var(--brick); border:1px solid rgba(168,70,47,.3); }
  .btn-danger:hover{ background:rgba(168,70,47,.08); }
  .btn-sm{ padding:6px 12px; font-size:12px; }

  /* ---------- Cards / grid ---------- */
  .stat-row{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px;
    margin-bottom:32px;
  }
  .stat-card{
    background:var(--paper); border:1px solid var(--line);
    padding:18px 20px; border-radius:var(--radius);
    position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--brass);
  }
  .stat-num{
    font-family:'JetBrains Mono', monospace;
    font-weight:600; font-size:26px; color:var(--jade-deep);
  }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .section-block{
    background:var(--paper); border:1px solid var(--line);
    border-radius:var(--radius); margin-bottom:20px;
  }
  .section-block-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    font-weight:700; font-size:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .section-block-body{ padding:16px 20px; }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13px;
  }

  /* ---------- Table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left; padding:10px 12px;
    font-size:11px; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-soft); border-bottom:2px solid var(--line);
    font-weight:600;
  }
  td{ padding:12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr.row-hover:hover{ background:var(--stone); }

  /* ---------- Stamp badges (signature element) ---------- */
  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC', serif; font-weight:900;
    font-size:11px; letter-spacing:1px;
    border:1.5px solid currentColor; border-radius:3px;
    padding:3px 9px;
    transform:rotate(-2deg);
    position:relative;
  }
  .stamp::after{
    content:''; position:absolute; inset:2px;
    border:1px solid currentColor; border-radius:1px; opacity:.4;
  }
  .stamp-active{ color:var(--jade); }
  .stamp-done{ color:var(--brick); }
  .stamp-pending{ color:var(--brass); }
  .stamp-lost{ color:var(--ink-soft); }

  .tag{
    display:inline-block; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:10px;
    background:var(--stone-deep); color:var(--ink-soft);
  }
  .tag-soft{
    display:inline-block; font-size:11px; font-weight:600;
    color:var(--ink-soft);
  }

  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); font-size:14px; padding:4px 6px;
    border-radius:2px;
  }
  .icon-btn:hover{ color:var(--ink); background:var(--stone); }

  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .search-input, select.filter-select{
    font-family:'Noto Sans TC', sans-serif;
    padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper); font-size:13px; color:var(--ink);
  }
  .search-input{ flex:1; min-width:180px; }
  .search-input:focus, select.filter-select:focus, input:focus, textarea:focus{
    outline:2px solid var(--brass); outline-offset:1px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,38,32,0.5);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 20px; overflow-y:auto; z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--paper); width:100%; max-width:560px;
    border-radius:var(--radius); border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(43,38,32,0.25);
  }
  .modal-head{
    padding:20px 24px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-title{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:18px; }
  .modal-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); }
  .modal-body{ padding:20px 24px; display:flex; flex-direction:column; gap:16px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }

  .field label{ display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:var(--radius); font-family:'Noto Sans TC', sans-serif; font-size:13px;
    background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-divider{ border-top:1px dashed var(--line); padding-top:14px; margin-top:2px; }
  .field-sub-title{ font-size:16px; font-weight:700; color:var(--jade-deep); margin-bottom:8px; letter-spacing:.5px; }

  /* ---------- Photo upload ---------- */
  .photo-chip{
    position:relative; width:72px; height:72px; border-radius:2px; overflow:hidden;
    border:1px solid var(--line); flex-shrink:0;
  }
  .photo-chip img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-chip .rm{
    position:absolute; top:2px; right:2px; background:rgba(43,38,32,0.75); color:#fff;
    border:none; width:18px; height:18px; border-radius:50%; font-size:11px; cursor:pointer;
    display:flex;align-items:center;justify-content:center; line-height:1;
  }
  .photo-grid{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .upload-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px dashed var(--line); border-radius:2px; padding:0 14px;
    width:72px; height:72px; justify-content:center; text-align:center;
    font-size:11px; color:var(--ink-soft); cursor:pointer; background:var(--stone);
    flex-shrink:0; line-height:1.3;
  }
  .upload-btn:hover{ border-color:var(--jade); color:var(--jade); }
  .card-photo-row{ display:flex; align-items:center; gap:12px; }
  .card-photo-preview{
    width:130px; height:82px; border:1px solid var(--line); border-radius:2px;
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:var(--stone); color:var(--ink-soft); font-size:11px; flex-shrink:0; position:relative;
  }
  .card-photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .card-photo-preview .rm{
    position:absolute; top:2px; right:2px; background:rgba(43,38,32,0.75); color:#fff;
    border:none; width:18px; height:18px; border-radius:50%; font-size:11px; cursor:pointer;
  }

  /* ---------- Service log ---------- */
  .log-list{ display:flex; flex-direction:column; gap:8px; border:1px solid var(--line); border-radius:2px; padding:10px; background:var(--stone); }
  .log-entry{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; font-size:12px; background:var(--paper); padding:8px 10px; border-radius:2px; border:1px solid var(--line); }
  .log-entry-date{ font-family:'JetBrains Mono',monospace; color:var(--brass); font-weight:700; white-space:nowrap; }
  .log-entry-note{ flex:1; color:var(--ink); line-height:1.5; }
  .log-entry .rm{ background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px; flex-shrink:0; }
  .log-entry .rm:hover{ color:var(--brick); }
  .log-add-row{ display:flex; gap:6px; margin-top:10px; }
  .log-add-row input[type=date]{ width:132px; flex-shrink:0; }
  .log-add-row input[type=text]{ flex:1; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--jade-deep); color:var(--stone); padding:12px 22px;
    border-radius:var(--radius); font-size:13px; font-weight:600;
    opacity:0; transition:all .25s ease; z-index:200; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading-note{ font-size:12px; color:var(--ink-soft); padding:20px; }

  /* ---------- Post tool page (scoped under .pt-page) ---------- */
  .pt-page{ background:var(--stone); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); }
  .pt-header{ background:var(--jade-deep); color:var(--paper); padding:28px 20px 24px; text-align:center; }
  .pt-header h1{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:22px; margin:0 0 4px; letter-spacing:.04em; }
  .pt-header p{ margin:0; font-size:13px; color:var(--brass-soft); }
  .pt-main{ max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  .pt-step{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:18px 16px; margin-bottom:16px; }
  .pt-step-label{ display:flex; align-items:center; gap:8px; font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px; color:var(--jade-deep); margin-bottom:10px; }
  .pt-step-num{ width:22px;height:22px; border-radius:50%; background:var(--brass); color:#fff; font-size:12px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .pt-page input[type=text], .pt-page input[type=url], .pt-page textarea{
    width:100%; border:1px solid var(--line); border-radius:6px; padding:10px 12px;
    font-family:'Noto Sans TC',sans-serif; font-size:14px; color:var(--ink); background:var(--paper);
  }
  .pt-page input:focus, .pt-page textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; background:#fff; }
  .pt-page textarea{ min-height:180px; resize:vertical; line-height:1.7; }
  .pt-hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .pt-page button{ font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:14px; border:none; border-radius:6px; padding:11px 18px; cursor:pointer; transition:opacity .15s; }
  .pt-page button:disabled{ opacity:.5; cursor:not-allowed; }
  .pt-page button:hover:not(:disabled){ opacity:.88; }
  .pt-btn-primary{ background:var(--jade); color:#fff; width:100%; }
  .pt-btn-brass{ background:var(--brass); color:#fff; }
  .pt-btn-outline{ background:transparent; color:var(--jade); border:1px solid var(--jade); }
  .pt-row-buttons{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .pt-row-buttons button{ flex:1; min-width:120px; }
  .pt-notice{ background:var(--brass-soft); border:1px solid var(--brass); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--ink); margin-bottom:16px; }
  .pt-notice b{ color:var(--brick); }
  .pt-spinner{ display:inline-block; width:14px;height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:pt-spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes pt-spin{ to{ transform:rotate(360deg); } }
  .pt-fb-card{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .pt-fb-card-head{ display:flex; align-items:center; gap:10px; padding:12px 14px 8px; }
  .pt-fb-avatar{ width:38px;height:38px; border-radius:50%; background:var(--jade-deep); color:#fff; font-family:'Noto Serif TC',serif; font-weight:700; display:flex;align-items:center;justify-content:center; font-size:15px; flex-shrink:0; }
  .pt-fb-name{ font-weight:700; font-size:14px; color:var(--ink); }
  .pt-fb-meta{ font-size:11.5px; color:var(--ink-soft); }
  .pt-fb-body{ padding:4px 14px 16px; white-space:pre-wrap; font-size:14px; color:var(--ink); }
  .pt-status{ font-size:12.5px; margin-top:8px; color:var(--ink-soft); }
  .pt-status.ok{ color:var(--jade); }
  .pt-status.err{ color:var(--brick); }
  .pt-photo-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; margin-bottom:4px; }
  .pt-photo-thumb{ position:relative; aspect-ratio:1; border:1px solid var(--line); overflow:hidden; background:var(--stone-deep); }
  .pt-photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .pt-photo-thumb .pt-remove-btn{ position:absolute; top:2px;right:2px; width:20px;height:20px; border-radius:50%; background:rgba(43,38,32,.7); color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer; padding:0; }

  /* ---------- Calendar page ---------- */
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); padding:8px 0; border-bottom:1px solid var(--line); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-cell{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; min-height:92px; overflow:hidden; }
  .cal-grid .cal-cell:nth-child(7n){ border-right:none; }
  .cal-empty{ background:var(--stone); }
  .cal-today{ background:var(--brass-soft); }
  .cal-daynum{ font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .cal-events{ display:flex; flex-direction:column; gap:2px; }
  .cal-event{ font-size:11px; background:var(--jade); color:#fff; padding:2px 5px; border-radius:2px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:3px; }
  .cal-event:hover{ background:var(--jade-deep); }
  .cal-event input[type=checkbox]{ width:11px; height:11px; flex-shrink:0; cursor:pointer; margin:0; }
  .cal-event span{ overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .cal-event-done{ background:var(--stone-deep) !important; color:var(--ink-soft); }
  .cal-event-done span{ text-decoration:line-through; }

  @media (max-width:820px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:14px 0; align-items:center; }
    .brand{ display:none; }
    .nav{ flex-direction:row; }
    .nav-item{ padding:10px 16px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    .nav-item.active{ border-left:none; border-bottom:3px solid var(--brass); }
    .sidebar-foot{ display:none; }
    .main{ padding:20px; }
    .stat-row{ grid-template-columns:1fr 1fr; }
    .field-row{ grid-template-columns:1fr; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="loginScreen" style="display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--stone);">
  <div style="background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:36px 32px; width:100%; max-width:340px;">
    <div style="font-family:'Noto Serif TC',serif; font-weight:900; font-size:22px; color:var(--jade-deep); text-align:center; margin-bottom:4px;">雅慈工作台</div>
    <div style="font-size:12px; color:var(--ink-soft); text-align:center; margin-bottom:24px;">登入後才能查看資料</div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" autocomplete="username"></div>
    <div class="field" style="margin-top:12px;"><label>密碼</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:18px;">登入</button>
    <div id="loginError" style="color:var(--brick); font-size:12px; margin-top:10px; min-height:16px;"></div>
  </div>
</div>

<div class="app" style="display:none;">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">雅慈工作台</div>
      <div class="brand-sub">房產好夥伴</div>
    </div>
    <div class="nav" id="nav">
      <div class="nav-item active" data-page="dashboard"><span class="nav-icon">◆</span>總覽</div>
      <div class="nav-item" data-page="clients"><span class="nav-icon">☰</span>客戶名單</div>
      <div class="nav-item" data-page="soldclients"><span class="nav-icon">✓</span>已成交客戶</div>
      <div class="nav-item" data-page="entrusted"><span class="nav-icon">⌂</span>物件委託</div>
      <div class="nav-item" data-page="deals"><span class="nav-icon">印</span>業績成交</div>
      <div class="nav-item" data-page="posttool"><span class="nav-icon">✍</span>貼文小工具</div>
      <div class="nav-item" data-page="calendar"><span class="nav-icon">▦</span>行事曆</div>
    </div>
    <div class="sidebar-foot">
      <button class="btn-sidebar" id="exportBtn">⬇ 匯出備份</button>

<script>
/* ===================== State ===================== */
let DATA = { clients: [], listings: [], content: [], deals: [] };
let currentPage = 'dashboard';
let editingCtx = null; // {type, id, ...extra}
let calendarMonth = new Date();
let loaded = false;

const KEYS = { clients:'clients', listings:'listings', content:'content', deals:'deals' };

/* ===================== Storage: records (chunked to stay under Firestore's ~1MB per-document limit) ===================== */
function utf8ByteLength(str){
  return new TextEncoder().encode(str).length;
}
function chunkArrayBySize(arr, maxBytes){
  const chunks = [];
  let current = [];
  let currentSize = 2;
  for(const item of arr){
    const itemStr = JSON.stringify(item);
    const itemSize = utf8ByteLength(itemStr) + 1;
    if(currentSize + itemSize > maxBytes && current.length > 0){
      chunks.push(current);
      current = [];
      currentSize = 2;
    }
    current.push(item);
    currentSize += itemSize;
  }
  if(current.length || chunks.length === 0) chunks.push(current);
  return chunks;
}

async function loadAll(){
  for(const type of Object.keys(KEYS)){
    const key = KEYS[type];
    try{
      const countRes = await window.storage.get(key + '-shard-count', false);
      const count = countRes && countRes.value ? Number(countRes.value) || 0 : 0;
      if(count > 0){
        let combined = [];
        for(let i=0;i<count;i++){
          const res = await window.storage.get(`${key}-shard-${i}`, false);
          if(res && res.value) combined = combined.concat(JSON.parse(res.value));
        }
        DATA[type] = combined;
      }else{
        const res = await window.storage.get(key, false);
        DATA[type] = res && res.value ? JSON.parse(res.value) : [];
      }
    }catch(e){
      DATA[type] = [];
    }
  }
  loaded = true;
}

async function saveType(type){
  try{
    const key = KEYS[type];
    const chunks = chunkArrayBySize(DATA[type], 700000);

    let oldCount = 0;
    try{
      const meta = await window.storage.get(key + '-shard-count', false);
      oldCount = meta && meta.value ? Number(meta.value) || 0 : 0;
    }catch(e){}

    for(let i=0;i<chunks.length;i++){
      await window.storage.set(`${key}-shard-${i}`, JSON.stringify(chunks[i]), false);
    }
    for(let i=chunks.length;i<oldCount;i++){
      await window.storage.delete(`${key}-shard-${i}`, false);
    }
    await window.storage.set(key + '-shard-count', String(chunks.length), false);
  }catch(e){
    console.error(e);
    showToast('儲存失敗,請稍後再試');
  }
}

/* ===================== Storage: photos (separate keys) ===================== */
async function savePhoto(key, dataUrl){
  try{ await window.storage.set(key, dataUrl, false); }catch(e){ showToast('照片儲存失敗'); }
}
async function loadPhoto(key){
  if(!key) return null;
  try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
}
async function deletePhoto(key){
  if(!key) return;
  try{ await window.storage.delete(key, false); }catch(e){ /* ignore */ }
}

function resizeImage(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function isImageDataUrl(url){
  return /^data:image\//.test(url||'');
}
function mimeExtFromDataUrl(url){
  const m = /^data:([^;]+);/.exec(url||'');
  const mime = m ? m[1] : '';
  const map = {
    'application/pdf':'.pdf',
    'application/msword':'.doc',
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'.docx',
    'application/vnd.ms-excel':'.xls',
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'.xlsx',
    'image/jpeg':'.jpg', 'image/png':'.png', 'image/webp':'.webp', 'image/gif':'.gif',
    'text/plain':'.txt'
  };
  return map[mime] || '';
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function exportBackup(){
  showToast('準備備份檔中…');
  const backup = { exportedAt: new Date().toISOString(), data: DATA, photos: {} };
  const keys = [];
  DATA.clients.forEach(c=>{
    if(c.cardPhotoKey) keys.push(c.cardPhotoKey);
    if(c.attachmentKeys) keys.push(...c.attachmentKeys);
    getClientPropertyRecords(c).forEach(r=>{ if(r.photoKeys) keys.push(...r.photoKeys); });
  });
  for(const k of keys){
    const v = await loadPhoto(k);
    if(v) backup.photos[k] = v;
  }
  const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `雅慈工作台備份_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已下載備份檔');
}

/* ===================== Import client list from Excel (客戶管理 sheet) ===================== */
function normalizeExcelDate(v){
  if(v instanceof Date && !isNaN(v)){
    const y = v.getFullYear(), m = String(v.getMonth()+1).padStart(2,'0'), d = String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v === 'string'){
    const m = v.trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }
  return '';
}

document.getElementById('importExcelBtn').onclick = ()=> document.getElementById('importExcelInput').click();

      lineKeyed: colIndex('已KEY到LINE'),

      fileDate: colIndex('建檔日'),
      name: colIndex('客戶姓名'),
      gender: colIndex('性別'),
      buySell: colIndex('買賣'),
      source: colIndex('客戶來源'),
      phone1: colIndex('聯絡電話1'),

      lineId: colIndex('line ID'),
      company: colIndex('公司名稱'),
      idNumber: colIndex('身分證號'),
      birthday: colIndex('生日'),
      homeAddress: colIndex('居住地址'),
      propertyAddress: colIndex('物件地址'),
      needs: colIndex('需求'),
      background: colIndex('背景'),
      pastEntrusted: colIndex('曾經委託物件'),
      entrusted1: colIndex('委託物件'),
      entrusted2: colIndex('委託物件2'),

      matchResponse: colIndex('配對回應'),
      contactLog1: colIndex('聯絡紀錄1'),
      contactLog2: colIndex('聯絡紀錄2'),
      contactLog3: colIndex('聯絡紀錄3'),
    };

    if(idx.name === -1){ showToast('找不到「客戶姓名」欄位,請確認上傳的是客戶管理表'); return; }

    const get = (row, i) => (i>=0 && row[i]!==undefined && row[i]!==null) ? row[i] : '';

    };

      const s = String(v||'').trim();

      if(s.includes('賣')) types.push('賣方');
      if(s.includes('租')) types.push('租客');
      return types;

      if(!name) continue;

      const phones = [];

      const buySellRaw = String(get(row, idx.buySell)||'');
      const contactType = (buySellRaw.includes('賣') && !buySellRaw.includes('買')) ? '賣方聯絡' : '買方聯絡';
      [idx.contactLog1, idx.contactLog2, idx.contactLog3].forEach(i=>{

        if(v) serviceLogs.push({id:uid(), date:'', time:'', type:contactType, note:v});
      });

        id: uid(),
        name,
        phones,
        types: buySellToTypes(get(row, idx.buySell)),

        birthday: normalizeExcelDate(get(row, idx.birthday)) || '',
        fileDate: normalizeExcelDate(get(row, idx.fileDate)) || '',
        source: cellText(get(row, idx.source)),
        propertyAddress: cellText(get(row, idx.propertyAddress)),

        lineId: cellText(get(row, idx.lineId)),
        fb: '',
        company: cellText(get(row, idx.company)),
        idNumber: cellText(get(row, idx.idNumber)),
        homeAddress: cellText(get(row, idx.homeAddress)),
        clientNeeds: needs,
        propertyRecords,
        notes: notesParts.join('\n'),
        serviceLogs,
        cardPhotoKey: null,
        attachmentKeys: [],
      });
    }

    if(imported.length===0){ showToast('沒有找到可匯入的客戶資料'); return; }

    const isDuplicate = (newClient, againstList) => {
      const newPhones = new Set(newClient.phones.map(p=>p.number).filter(Boolean));
      return againstList.some(c=>{
        if(c.name !== newClient.name) return false;
        const existingPhones = getClientPhones(c).map(p=>p.number).filter(Boolean);
        if(newPhones.size === 0 && existingPhones.length === 0) return true;
        return existingPhones.some(p=>newPhones.has(p));
      });
    };
    const toAdd = [];
    let skippedCount = 0;
    for(const c of imported){
      if(isDuplicate(c, DATA.clients) || isDuplicate(c, toAdd)){ skippedCount++; } else { toAdd.push(c); }
    }

    if(toAdd.length===0){ showToast(`Excel 裡的 ${imported.length} 筆都跟現有客戶重複(姓名+電話相同),沒有新資料可匯入`); return; }

    const confirmMsg = skippedCount > 0
      ? `找到 ${imported.length} 筆,其中 ${skippedCount} 筆姓名+電話跟現有客戶重複會自動略過,實際會新增 ${toAdd.length} 筆。確定要匯入嗎?`
      : `找到 ${toAdd.length} 筆客戶資料,會新增加到目前的客戶名單裡(不會刪除既有資料)。確定要匯入嗎?`;
    if(!confirm(confirmMsg)) return;

    showToast('匯入中,請稍候(資料量較大,可能需要一點時間)…');
    DATA.clients = DATA.clients.concat(toAdd);
    await saveType('clients');
    render();
    showToast(`已匯入 ${toAdd.length} 筆客戶${skippedCount>0?`(略過 ${skippedCount} 筆重複)`:''}`);
  }catch(err){
    console.error(err);
    showToast('匯入失敗,請確認上傳的是正確的客戶管理 Excel 檔');
  }
};

function getClientPhones(c){
  if(c.phones && c.phones.length) return c.phones;
  if(c.phone) return [{id:'legacy', number:c.phone, owner:''}];
  return [];
}
function getClientTypes(c){
  if(c.types && c.types.length) return c.types;
  if(c.type) return [c.type];
  return [];
}
function getClientStatuses(c){
  if(c.statuses && c.statuses.length) return c.statuses;
  if(c.status) return [c.status];
  return [];
}
function getClientLineNames(c){
  if(c.lineNames && c.lineNames.length) return c.lineNames;
  if(c.lineName) return [c.lineName];
  return [];
}
function getClientPropertyRecords(c){
  const recs = c.propertyRecords ? [...c.propertyRecords] : [];
  if(c.propertyRecords === undefined){
    if(c.pendingTrackProperties) recs.push({id:'legacy-pending', category:'待追蹤', content:c.pendingTrackProperties, photoKeys:[]});
    if(c.soldProperties) recs.push({id:'legacy-sold', category:'已成交', content:c.soldProperties, photoKeys:[]});
    if(c.entrustedInfo) recs.push({id:'legacy-entrusted', category:'委託中', content:c.entrustedInfo, photoKeys:[]});
  }
  if(c.pastEntrustedProperties && !recs.some(r=>r.id==='legacy-past')){
    recs.push({id:'legacy-past', category:'曾經委託', content:c.pastEntrustedProperties, photoKeys:[]});
  }
  return recs;
}
function clientTypesTags(c){
  const types = getClientTypes(c);
  return types.length ? types.map(t=>`<span class="tag">${esc(t)}</span>`).join(' ') : '—';
}
function clientStatusStamps(c){
  const statuses = getClientStatuses(c);
  return statuses.length ? statuses.map(s=>statusStamp(s)).join(' ') : '—';
}
function clientPhoneSummary(c){
  const phones = getClientPhones(c);
  if(!phones.length) return '—';
  const first = phones[0];
  const label = first.owner ? `${esc(first.number)}(${esc(first.owner)})` : esc(first.number);
  return phones.length>1 ? `${label} 等${phones.length}支` : label;
}

/* ===================== Shared helpers ===================== */
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function statusStamp(status){
  const map = {
    '追蹤中':'stamp-active','在售':'stamp-active','製作中':'stamp-active','草稿':'stamp-pending',
    '已成交':'stamp-done','已簽約':'stamp-done','已發布':'stamp-done',
    '已流失':'stamp-lost','已下架':'stamp-lost'
  };
  const cls = map[status] || 'stamp-pending';
  return `<span class="stamp ${cls}">${esc(status)}</span>`;
}

/* Add-row helpers: each returns true if something was added.

   saving the client so a forgotten "新增" click doesn't lose the draft. */
function addPhoneEntry(){
  const numEl = document.getElementById('phoneNumber');
  const ownerEl = document.getElementById('phoneOwner');
  if(!numEl) return false;
  const num = numEl.value.trim();
  const owner = ownerEl.value.trim();
  if(!num) return false;
  editingCtx.tempPhones.push({id:uid(), number:num, owner});
  numEl.value=''; ownerEl.value='';
  renderPhoneList();
  return true;
}

function addLineNameEntry(){
  const el = document.getElementById('lineNameInput');
  if(!el) return false;
  const v = el.value.trim();
  if(!v) return false;
  editingCtx.tempLineNames.push({id:uid(), value:v});
  el.value='';
  renderLineNameList();
  return true;
}

function addPropertyRecordEntry(){
  const contentEl = document.getElementById('propertyRecordContent');
  if(!contentEl) return false;
  const category = document.getElementById('propertyRecordCategory').value;
  const content = contentEl.value.trim();
  const entrustDate = document.getElementById('propertyRecordEntrustDate').value;
  const askingPrice = document.getElementById('propertyRecordAskingPrice').value.trim();
  const bottomPrice = document.getElementById('propertyRecordBottomPrice').value.trim();

  const ownerIdNumber = document.getElementById('propertyRecordOwnerIdNumber').value.trim();
  const ownerPhone = document.getElementById('propertyRecordOwnerPhone').value.trim();

  const priceHistory = (askingPrice || bottomPrice)
    ? [{id:uid(), date:entrustDate || new Date().toISOString().slice(0,10), askingPrice, bottomPrice, note:'新增'}]
    : [];

  contentEl.value='';
  document.getElementById('propertyRecordEntrustDate').value='';
  document.getElementById('propertyRecordAskingPrice').value='';
  document.getElementById('propertyRecordBottomPrice').value='';
  document.getElementById('propertyRecordOwnerName').value='';
  document.getElementById('propertyRecordOwnerIdNumber').value='';
  document.getElementById('propertyRecordOwnerPhone').value='';
  renderPropertyRecordList();
  return true;
}

function renderLogExtraFields(){
  const container = document.getElementById('logExtraFields');
  if(!container) return;
  const type = document.getElementById('logType').value;
  const config = SERVICE_LOG_EXTRA_FIELDS[type];
  if(!config){ container.innerHTML = ''; return; }

  if(config.repeating){
    container.innerHTML = `
      <div class="pt-hint" style="margin:0 0 4px;">這筆服務的詳細項目(可加入多筆)</div>
      <div class="log-list" id="viewingItemsList"></div>
      <div class="pt-hint" style="margin:8px 0 4px;">${config.fields.map(f=>f.label).join(' / ')}</div>
      ${config.fields.map(f=>`<input type="${f.type||'text'}" id="viewItem_${f.key}" placeholder="${esc(f.label)}" style="margin-bottom:6px;">`).join('')}
      <button class="btn btn-ghost btn-sm" type="button" id="addViewingItemBtn">＋ 加入這一間</button>
    `;
    drawViewingItemsList();
    document.getElementById('addViewingItemBtn').onclick = ()=>{
      const item = {};
      config.fields.forEach(f=>{
        const el = document.getElementById('viewItem_'+f.key);
        if(el && el.value) item[f.key] = el.value.trim ? el.value.trim() : el.value;
      });
      if(Object.keys(item).length === 0){ showToast('請至少填寫一項資料'); return; }
      editingCtx.logViewingItems.push({id:uid(), ...item});
      config.fields.forEach(f=>{ const el = document.getElementById('viewItem_'+f.key); if(el) el.value=''; });
      editingCtx.logDraftTouched = true;
      drawViewingItemsList();
    };
    return;
  }

  container.innerHTML = `<div class="pt-hint" style="margin:0 0 4px;">${config.fields.map(f=>f.label).join(' / ')}</div>` +
    config.fields.map(f=>`<input type="${f.type||'text'}" id="logExtra_${f.key}" placeholder="${esc(f.label)}" style="margin-bottom:6px;">`).join('');
  config.fields.forEach(f=>{
    const el = document.getElementById('logExtra_'+f.key);
    if(el){
      const mark = ()=>{ editingCtx.logDraftTouched = true; };
      el.addEventListener('input', mark);
      el.addEventListener('change', mark);
    }
  });
}

function drawViewingItemsList(){
  const wrap = document.getElementById('viewingItemsList');
  if(!wrap) return;
  const type = document.getElementById('logType').value;
  const config = SERVICE_LOG_EXTRA_FIELDS[type];
  if(!config || !config.repeating) return;
  const items = editingCtx.logViewingItems || [];
  if(items.length===0){ wrap.innerHTML = '<div class="empty-state" style="padding:10px;">尚未加入項目</div>'; return; }
  wrap.innerHTML = items.map((it,idx)=>{
    const summary = config.fields.map(f=> it[f.key] ? `${f.label}:${it[f.key]}` : '').filter(Boolean).join(' ・ ');
    return `<div class="log-entry">
      <div class="log-entry-note">第${idx+1}筆　${esc(summary || '(未填寫)')}</div>
      <button class="rm" onclick="removeViewingItem(${idx})" title="移除">✕</button>
    </div>`;
  }).join('');
}
function removeViewingItem(idx){
  editingCtx.logViewingItems.splice(idx,1);
  drawViewingItemsList();
}

function collectLogExtraFields(type){
  const config = SERVICE_LOG_EXTRA_FIELDS[type];
  if(!config) return {};
  if(config.repeating){
    return (editingCtx.logViewingItems && editingCtx.logViewingItems.length) ? {items: editingCtx.logViewingItems} : {};
  }
  const extra = {};
  config.fields.forEach(f=>{
    const el = document.getElementById('logExtra_'+f.key);
    if(el && el.value) extra[f.key] = el.value.trim ? el.value.trim() : el.value;
  });
  return extra;
}

function formatLogExtraPlainText(l){
  if(!l.extra) return '';
  const config = SERVICE_LOG_EXTRA_FIELDS[l.type];
  if(!config) return '';
  const renderField = (f, v) => v ? `${f.label}:${v}` : '';
  if(config.repeating){
    const items = l.extra.items || [];
    if(!items.length) return '';
    return items.map((it,i)=>{
      const parts = config.fields.map(f=>renderField(f, it[f.key])).filter(Boolean).join(' ');
      return `第${i+1}筆 ${parts}`;
    }).join(' ｜ ');
  }
  return config.fields.map(f=>renderField(f, l.extra[f.key])).filter(Boolean).join(' ・ ');
}

function formatLogExtra(l, multiline){
  if(!l.extra) return '';
  const config = SERVICE_LOG_EXTRA_FIELDS[l.type];
  if(!config) return '';

  const renderField = (f, v) => {
    if(!v) return '';
    if(f.key === 'url'){
      const href = /^https?:\/\//i.test(v) ? v : 'https://' + v;
      return `${esc(f.label)}:<a href="${esc(href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--jade-deep); text-decoration:underline;">${esc(v)}</a>`;
    }
    return `${esc(f.label)}:${esc(v)}`;
  };

  const fieldSep = multiline ? '<br>' : ' ';
  const itemSep = multiline ? '<br>' : ' ｜ ';
  const flatSep = multiline ? '<br>' : ' ・ ';

  if(config.repeating){
    const items = l.extra.items || [];
    if(!items.length) return '';
    return items.map((it,i)=>{
      const parts = config.fields.map(f=>renderField(f, it[f.key])).filter(Boolean).join(fieldSep);
      return `第${i+1}筆${multiline?'<br>':' '}${parts}`;
    }).join(itemSep);
  }
  const parts = [];
  config.fields.forEach(f=>{
    const html = renderField(f, l.extra[f.key]);
    if(html) parts.push(html);
  });
  return parts.join(flatSep);
}

async function persistServiceLogsIfExisting(){
  if(!editingCtx || !editingCtx.id) return false;
  const idx = DATA.clients.findIndex(c=>c.id===editingCtx.id);
  if(idx===-1) return false;
  DATA.clients[idx] = {...DATA.clients[idx], serviceLogs: editingCtx.tempLogs};
  await saveType('clients');
  return true;
}

async function addServiceLogEntry(force){
  const noteEl = document.getElementById('logNote');
  if(!noteEl) return false;
  const d = document.getElementById('logDate').value;
  const t = document.getElementById('logTime').value;
  const type = document.getElementById('logType').value;
  const n = noteEl.value.trim();
  const extra = collectLogExtraFields(type);
  const hasSignal = n || editingCtx.logDraftTouched || Object.keys(extra).length > 0;
  if(!force && !hasSignal) return false;
  editingCtx.tempLogs.unshift({id:uid(), date:d, time:t, type, note:n, extra});
  noteEl.value='';
  editingCtx.logViewingItems = [];
  document.getElementById('logType').value = SERVICE_LOG_TYPES[0];
  renderLogExtraFields();
  editingCtx.logDraftTouched = false;
  renderLogList();
  if(await persistServiceLogsIfExisting()) showToast('服務紀錄已儲存');
  return true;
}

/* Auto-add a drafted-but-not-yet-added "加入這一筆" item (for 帶看/買方聯絡 style repeating logs). */
function flushPendingViewingItem(){
  const typeEl = document.getElementById('logType');
  if(!typeEl) return;
  const config = SERVICE_LOG_EXTRA_FIELDS[typeEl.value];
  if(!config || !config.repeating) return;
  const item = {};
  config.fields.forEach(f=>{
    const el = document.getElementById('viewItem_'+f.key);
    if(el && el.value) item[f.key] = el.value.trim ? el.value.trim() : el.value;
  });
  if(Object.keys(item).length === 0) return;
  editingCtx.logViewingItems.push({id:uid(), ...item});
  editingCtx.logDraftTouched = true;
  config.fields.forEach(f=>{ const el = document.getElementById('viewItem_'+f.key); if(el) el.value=''; });
}

function savePropertyRecordEdit(recordId){
  const category = document.getElementById('editRecordCategory-'+recordId).value;
  const content = document.getElementById('editRecordContent-'+recordId).value.trim();
  const entrustDate = document.getElementById('editRecordEntrustDate-'+recordId).value;
  const askingPrice = document.getElementById('editRecordAsking-'+recordId).value.trim();
  const bottomPrice = document.getElementById('editRecordBottom-'+recordId).value.trim();
  const ownerName = document.getElementById('editRecordOwnerName-'+recordId).value.trim();
  const ownerIdNumber = document.getElementById('editRecordOwnerIdNumber-'+recordId).value.trim();
  const ownerPhone = document.getElementById('editRecordOwnerPhone-'+recordId).value.trim();
  if(!content){ showToast('請輸入物件內容'); return; }
  const rec = (editingCtx.tempPropertyRecords||[]).find(r=>r.id===recordId);
  if(!rec) return;
  if(!rec.priceHistory) rec.priceHistory = [];
  if((askingPrice||'') !== (rec.askingPrice||'') || (bottomPrice||'') !== (rec.bottomPrice||'')){
    rec.priceHistory.push({id:uid(), date:new Date().toISOString().slice(0,10), askingPrice, bottomPrice, note:'變更'});
  }
  rec.category = category;
  rec.content = content;
  rec.entrustDate = entrustDate;
  rec.askingPrice = askingPrice;
  rec.bottomPrice = bottomPrice;
  rec.ownerName = ownerName;
  rec.ownerIdNumber = ownerIdNumber;
  rec.ownerPhone = ownerPhone;
  editingCtx.editingRecordId = null;
  renderPropertyRecordList();
}

async function loadPropertyRecordAlbum(recordId){
  const record = (editingCtx.tempPropertyRecords||[]).find(r=>r.id===recordId);
  if(!record) return;
  if(!editingCtx.recordPhotosCache[recordId]){
    editingCtx.recordPhotosCache[recordId] = { photos: [], removedKeys: [] };
    for(const k of (record.photoKeys||[])){
      const dataUrl = await loadPhoto(k);
      if(dataUrl) editingCtx.recordPhotosCache[recordId].photos.push({key:k, dataUrl});
    }
  }
  drawPropertyRecordAlbumGrid(recordId);

  const input = document.getElementById('propRecordPhotoInput-' + recordId);
  if(input){
    input.onchange = async (e)=>{
      const files = Array.from(e.target.files||[]);
      for(const file of files){
        const dataUrl = file.type.startsWith('image/')
          ? await resizeImage(file, 1000, 0.72)
          : await readFileAsDataUrl(file);
        editingCtx.recordPhotosCache[recordId].photos.push({key:null, dataUrl});
      }
      e.target.value = '';
      renderPropertyRecordList();
    };
  }
}

function drawPropertyRecordAlbumGrid(recordId){
  const grid = document.getElementById('propRecordPhotoGrid-' + recordId);
  if(!grid) return;
  const cache = editingCtx.recordPhotosCache[recordId];
  const addTile = `<div class="upload-btn" onclick="document.getElementById('propRecordPhotoInput-${recordId}').click()">＋<br>照片/檔案</div>`;

        <img src="${p.dataUrl}">

      <button class="rm" onclick="removePropertyRecordPhoto('${recordId}',${idx})" title="移除">✕</button>

function removePropertyRecordPhoto(recordId, idx){

function renderEditLogExtraFields(logId){
  const container = document.getElementById('editLogExtraFields-'+logId);

  const l = (editingCtx.tempLogs||[]).find(x=>x.id===logId);
  const type = document.getElementById('editLogType-'+logId).value;

  if(config.repeating){
    container.innerHTML = `
      <div class="pt-hint" style="margin:0 0 4px;">這筆服務的詳細項目(可加入多筆)</div>
      <div class="log-list" id="editViewingItemsList-${logId}"></div>

function drawEditViewingItemsList(logId){
  const wrap = document.getElementById('editViewingItemsList-'+logId);
  if(!wrap) return;
  const type = document.getElementById('editLogType-'+logId).value;
  const config = SERVICE_LOG_EXTRA_FIELDS[type];
  if(!config || !config.repeating) return;
  const items = editingCtx.editingLogViewingItems || [];
  if(items.length===0){ wrap.innerHTML = '<div class="empty-state" style="padding:10px;">尚未加入項目</div>'; return; }
  wrap.innerHTML = items.map((it,idx)=>{
    const summary = config.fields.map(f=> it[f.key] ? `${f.label}:${it[f.key]}` : '').filter(Boolean).join(' ・ ');
    return `<div class="log-entry">
      <div class="log-entry-note">第${idx+1}筆　${esc(summary || '(未填寫)')}</div>
      <button class="rm" onclick="removeEditViewingItem('${logId}',${idx})" title="移除">✕</button>
    </div>`;
  }).join('');
}
function removeEditViewingItem(logId, idx){
  editingCtx.editingLogViewingItems.splice(idx,1);
  drawEditViewingItemsList(logId);
}
function addEditViewingItem(logId){
  const type = document.getElementById('editLogType-'+logId).value;
  const config = SERVICE_LOG_EXTRA_FIELDS[type];
  if(!config || !config.repeating) return;
  const item = {};
  config.fields.forEach(f=>{
    const el = document.getElementById(`editViewItem-${logId}-${f.key}`);
    if(el && el.value) item[f.key] = el.value.trim ? el.value.trim() : el.value;
  });
  if(Object.keys(item).length === 0){ showToast('請至少填寫一項資料'); return; }
  editingCtx.editingLogViewingItems.push({id:uid(), ...item});
  config.fields.forEach(f=>{ const el = document.getElementById(`editViewItem-${logId}-${f.key}`); if(el) el.value=''; });
  drawEditViewingItemsList(logId);
}

async function saveLogEdit(logId){
  const l = (editingCtx.tempLogs||[]).find(x=>x.id===logId);
  if(!l) return;
  const date = document.getElementById('editLogDate-'+logId).value;
  const time = document.getElementById('editLogTime-'+logId).value;
  const type = document.getElementById('editLogType-'+logId).value;
  const note = document.getElementById('editLogNote-'+logId).value.trim();
  const config = SERVICE_LOG_EXTRA_FIELDS[type];
  let extra = {};
  if(config){
    if(config.repeating){
      if(editingCtx.editingLogViewingItems && editingCtx.editingLogViewingItems.length) extra = {items: editingCtx.editingLogViewingItems};
    }else{
      config.fields.forEach(f=>{
        const el = document.getElementById(`editLogExtra-${logId}-${f.key}`);
        if(el && el.value) extra[f.key] = el.value.trim ? el.value.trim() : el.value;
      });
    }
  }
  l.date = date;
  l.time = time;
  l.type = type;
  l.note = note;
  l.extra = extra;
  editingCtx.editingLogId = null;
  editingCtx.editingLogViewingItems = [];
  renderLogList();
  if(await persistServiceLogsIfExisting()) showToast('服務紀錄已儲存');
}

async function saveClient(){
  await flushPendingClientInputs();
  const typesChecked = Array.from(document.querySelectorAll('.f_type_cb:checked')).map(cb=>cb.value);
  const statusesChecked = Array.from(document.querySelectorAll('.f_status_cb:checked')).map(cb=>cb.value);
  const vals = {
    name: document.getElementById('f_name').value.trim(),
    phones: editingCtx.tempPhones || [],
    types: typesChecked,
    statuses: statusesChecked,
    birthday: document.getElementById('f_birthday').value,
    fileDate: document.getElementById('f_fileDate').value,
    source: document.getElementById('f_source').value.trim(),
    propertyAddress: document.getElementById('f_propertyAddress').value.trim(),
    lineNames: (editingCtx.tempLineNames || []).map(n=>n.value),
    lineId: document.getElementById('f_lineId').value.trim(),
    fb: document.getElementById('f_fb').value.trim(),
    company: document.getElementById('f_company').value.trim(),
    idNumber: document.getElementById('f_idNumber').value.trim(),
    homeAddress: document.getElementById('f_homeAddress').value.trim(),
    clientNeeds: document.getElementById('f_clientNeeds').value.trim(),
    propertyRecords: editingCtx.tempPropertyRecords || [],
    notes: document.getElementById('f_notes').value.trim(),
    serviceLogs: editingCtx.tempLogs || [],
  };
  if(!vals.name){ showToast('請輸入姓名'); return false; }

  if(editingCtx.removedCardKey) await deletePhoto(editingCtx.removedCardKey);
  if(editingCtx.cardPhoto.dataUrl && !editingCtx.cardPhoto.key){
    const newKey = 'photo:client:' + uid();
    await savePhoto(newKey, editingCtx.cardPhoto.dataUrl);
    editingCtx.cardPhoto.key = newKey;
  }
  vals.cardPhotoKey = editingCtx.cardPhoto.key || null;

  for(const k of editingCtx.removedAttachmentKeys) await deletePhoto(k);
  for(const p of editingCtx.attachments){
    if(!p.key){
      const newKey = 'photo:client-doc:' + uid();
      await savePhoto(newKey, p.dataUrl);
      p.key = newKey;
    }
  }
  vals.attachmentKeys = editingCtx.attachments.map(p=>p.key);

  for(const k of editingCtx.removedRecordPhotoKeys) await deletePhoto(k);
  for(const record of vals.propertyRecords){
    const cache = editingCtx.recordPhotosCache[record.id];
    if(!cache) continue;
    for(const k of cache.removedKeys) await deletePhoto(k);
    for(const p of cache.photos){
      if(!p.key){
        const newKey = 'photo:property-record:' + uid();
        await savePhoto(newKey, p.dataUrl);
        p.key = newKey;
      }
    }
    record.photoKeys = cache.photos.map(p=>p.key);
  }

  if(editingCtx.id){
    const idx = DATA.clients.findIndex(c=>c.id===editingCtx.id);
    DATA.clients[idx] = {...DATA.clients[idx], ...vals};
  }else{
    DATA.clients.push({id: uid(), ...vals});
  }
  await saveType('clients');
  return true;
}

let currentViewClientId = null;
let __lightboxPhotos = [];

function pushLightboxPhoto(src, filename){
  __lightboxPhotos.push({src, filename});
  return __lightboxPhotos.length - 1;
}
function openLightboxByIndex(i){
  const p = __lightboxPhotos[i];
  if(!p || !p.src) return;
  openLightbox(p.src, p.filename);
}
function openOrDownloadFile(i){
  const p = __lightboxPhotos[i];
  if(!p || !p.src) return;
  if(isImageDataUrl(p.src)){
    openLightbox(p.src, p.filename);
  }else if(/^data:application\/pdf/.test(p.src)){
    window.open(p.src, '_blank');
  }else{
    const a = document.createElement('a');
    a.href = p.src;
    a.download = p.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}
function downloadAllPhotos(indices){
  indices.forEach((idx, i)=>{
    const p = __lightboxPhotos[idx];
    if(!p || !p.src) return;
    setTimeout(()=>{
      const a = document.createElement('a');
      a.href = p.src;
      a.download = p.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, i * 250);
  });
}
function openLightbox(src, filename){
  document.getElementById('lightboxImg').src = src;
  const dl = document.getElementById('lightboxDownload');
  dl.href = src;
  dl.download = filename || 'photo.jpg';
  document.getElementById('lightboxOverlay').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('open');
}
document.getElementById('lightboxClose').onclick = closeLightbox;

      <input type="file" accept="image/*" multiple id="listingPhotoInput" style="display:none;">
    </div>
  `;
  openModal();

  editingCtx.photos = [];
  for(const k of (item.photoKeys||[])){
    const dataUrl = await loadPhoto(k);
    if(dataUrl) editingCtx.photos.push({key:k, dataUrl});
  }
  renderPhotoGrid();

  document.getElementById('listingPhotoInput').onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    for(const file of files){
      const dataUrl = await resizeImage(file, 1000, 0.72);
      editingCtx.photos.push({key:null, dataUrl});

    e.target.value = '';
    renderPhotoGrid();

function renderPhotoGrid(){
  const grid = document.getElementById('photoGrid');
  if(!grid) return;
  const addTile = `<div class="upload-btn" id="addPhotoTile">＋<br>新增照片</div>`;
  grid.innerHTML = editingCtx.photos.map((p,idx)=>`
    <div class="photo-chip">
      <img src="${p.dataUrl}">
      <button class="rm" onclick="removeListingPhoto(${idx})" title="移除">✕</button>
    </div>
  `).join('') + addTile;
  document.getElementById('addPhotoTile').onclick = ()=>document.getElementById('listingPhotoInput').click();
}
function removeListingPhoto(idx){
  const p = editingCtx.photos[idx];
  if(p.key) editingCtx.removedKeys.push(p.key);
  editingCtx.photos.splice(idx,1);
  renderPhotoGrid();
}

async function saveListing(){
  const vals = {
    name: document.getElementById('f_name').value.trim(),
    type: document.getElementById('f_type').value,
    price: document.getElementById('f_price').value,
    address: document.getElementById('f_address').value.trim(),
    status: document.getElementById('f_status').value,
    ownerName: document.getElementById('f_ownerName').value.trim(),
    ownerPhone: document.getElementById('f_ownerPhone').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(!vals.name){ showToast('請輸入物件名稱'); return false; }

  for(const k of editingCtx.removedKeys) await deletePhoto(k);
  for(const p of editingCtx.photos){
    if(!p.key){
      const newKey = 'photo:listing:' + uid();
      await savePhoto(newKey, p.dataUrl);
      p.key = newKey;
    }
  }
  vals.photoKeys = editingCtx.photos.map(p=>p.key);

  if(editingCtx.id){
    const idx = DATA.listings.findIndex(l=>l.id===editingCtx.id);
    DATA.listings[idx] = {...DATA.listings[idx], ...vals};
  }else{
    DATA.listings.push({id: uid(), ...vals});
  }
  await saveType('listings');
  return true;
}

async function saveDeal(){
  const vals = {
    caseName: document.getElementById('f_caseName').value.trim(),
    clientName: document.getElementById('f_clientName').value.trim(),
    amount: document.getElementById('f_amount').value,
    rate: document.getElementById('f_rate').value,
    commission: document.getElementById('f_commission').value,
    closedDate: document.getElementById('f_closedDate').value,
  };
  if(!vals.caseName){ showToast('請輸入案件名稱'); return false; }
  if(editingCtx.id){
    const idx = DATA.deals.findIndex(d=>d.id===editingCtx.id);
    DATA.deals[idx] = {...DATA.deals[idx], ...vals};
  }else{
    DATA.deals.push({id: uid(), ...vals});
  }
  await saveType('deals');
  return true;
}

function ptUpdatePreview(){
  const v = ptDraftEl.value.trim();
  ptPreviewEl.textContent = v || "在上方產生或輸入文案後，這裡會即時顯示預覽。";
}

function ptEscapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function ptLoadGroups(){
  try{
    const res = await window.storage.get('postGroups', false);
    ptGroups = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    ptGroups = [];
  }
  ptRenderGroups();
}

function ptRenderGroups(){
  const el = document.getElementById('ptGroupList');
  if(!el) return;
  if(!ptGroups.length){
    el.innerHTML = '<div class="pt-hint" style="margin-top:0;">尚未加入任何社團</div>';
    return;
  }
  el.innerHTML = ptGroups.map((g, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);">
      <div style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ptEscapeHtml(g.label || g.url)}</div>
      <button class="pt-btn-brass" style="padding:6px 12px;font-size:12px;" onclick="ptOpenGroupAt(${i})">開啟</button>
      <button class="pt-btn-outline" style="padding:6px 10px;font-size:12px;" onclick="ptRemoveGroup(${i})">移除</button>
    </div>
  `).join('');
}

async function ptSaveGroups(){
  try{ await window.storage.set('postGroups', JSON.stringify(ptGroups), false); }
  catch(e){ showToast('社團清單儲存失敗'); }
}

async function ptAddGroup(){
  const urlInput = document.getElementById('ptGroupUrlInput');
  const labelInput = document.getElementById('ptGroupLabelInput');
  const url = urlInput.value.trim();
  const label = labelInput.value.trim();
  if(!url){
    ptCopyStatusEl.textContent = '請先貼上社團網址';
    ptCopyStatusEl.className = 'pt-status err';
    return;
  }
  ptGroups.push({ url, label });
  await ptSaveGroups();
  urlInput.value = '';
  labelInput.value = '';
  ptRenderGroups();
}

async function ptRemoveGroup(i){
  ptGroups.splice(i, 1);
  await ptSaveGroups();
  ptRenderGroups();
}

function ptOpenGroupAt(i){
  const g = ptGroups[i];
  if(g) window.open(g.url, '_blank');
}

function ptOpenMapSearch(keyword){
  const address = ptFieldEls.address.value.trim();
  if(!address){
    alert('請先輸入地址');
    return;
  }
  const q = encodeURIComponent(address + ' 附近' + keyword);
  window.open('https://www.google.com/maps/search/' + q + '?hl=zh-TW', '_blank');
}

function ptToggleSchoolZonePanel(){
  const panel = document.getElementById('ptSchoolZonePanel');
  const willShow = panel.style.display === 'none';
  panel.style.display = willShow ? 'block' : 'none';
  if(willShow) ptRenderSchoolZoneResults();
}

function ptSchoolZoneHighlight(text, keyword){
  if(!keyword) return text;
  const idx = text.indexOf(keyword);
  if(idx === -1) return text;
  return text.slice(0, idx) + '<mark style="background:#F6E3A1;padding:0 2px;">' + text.slice(idx, idx + keyword.length) + '</mark>' + text.slice(idx + keyword.length);
}

function ptRenderSchoolZoneResults(){
  const keyword = document.getElementById('ptVillageInput').value.trim();
  const container = document.getElementById('ptSchoolZoneResults');

  const buildSection = (title, list) => {
    const matched = keyword ? list.filter(s => s.zone.includes(keyword)) : [];
    if(!keyword){
      return `<div class="pt-hint" style="margin-top:0;">輸入村里名稱後，這裡會列出${title}</div>`;
    }
    if(!matched.length) return '';
    return `<div style="font-weight:700;color:var(--brass);font-size:12.5px;margin:8px 0 4px;">${title}</div>` +
      matched.map(s => `
        <div style="border-bottom:1px solid var(--line);padding:8px 0;">
          <div style="font-weight:700;color:var(--jade-deep);font-size:13.5px;">${s.school}　<span style="font-weight:400;color:var(--ink-soft);font-size:11px;">${s.district}</span></div>
          <div style="font-size:12.5px;">${ptSchoolZoneHighlight(s.zone, keyword)}</div>
          <div style="font-size:11px;color:var(--ink-soft);">☎ ${s.phone}</div>
        </div>
      `).join('');
  };

  const elemHtml = buildSection('國小', PT_SCHOOL_ZONE_ELEMENTARY);
  const juniorHtml = buildSection('國中', PT_SCHOOL_ZONE_JUNIOR);

  if(keyword && !elemHtml && !juniorHtml){
    container.innerHTML = `<div class="pt-hint" style="margin-top:0;">沒有找到包含「${keyword}」的村里，目前資料庫只有平鎮區、中壢區，其他區還沒建，或村里名稱打法不同。</div>`;
  } else {
    container.innerHTML = elemHtml + juniorHtml;
  }
}

function ptComposeFromFields(){
  const title = ptFieldEls.title.value.trim();
  const price = ptFieldEls.price.value.trim();
  const landPing = ptFieldEls.landPing.value.trim();
  const buildPing = ptFieldEls.buildPing.value.trim();
  const layout = ptFieldEls.layout.value.trim();
  const desc = ptFieldEls.desc.value.trim();

  const specs = [];
  if(price) specs.push(`💰 售價 ${price}`);
  if(landPing) specs.push(`📐 地坪 ${landPing}`);
  if(buildPing) specs.push(`🏗 建坪 ${buildPing}`);
  if(layout) specs.push(`🏠 格局 ${layout}`);

  const nearbyLines = [];
  const park = ptFieldEls.park.value.trim();
  const bus = ptFieldEls.bus.value.trim();
  const conv = ptFieldEls.conv.value.trim();
  const market = ptFieldEls.market.value.trim();
  const px = ptFieldEls.px.value.trim();
  const elementary = ptFieldEls.elementary.value.trim();
  const juniorHigh = ptFieldEls.juniorHigh.value.trim();
  if(park) nearbyLines.push(`🌳 公園：${park}`);
  if(bus) nearbyLines.push(`🚌 公車站：${bus}`);
  if(conv) nearbyLines.push(`🏪 超商：${conv}`);
  if(market) nearbyLines.push(`🛍 賣場：${market}`);
  if(px) nearbyLines.push(`🛒 全聯：${px}`);
  if(elementary) nearbyLines.push(`🏫 國小：${elementary}`);
  if(juniorHigh) nearbyLines.push(`🏫 國中：${juniorHigh}`);

  const parts = [];
  if(title) parts.push(`【${title}】`);
  if(specs.length) parts.push(specs.join('\n'));
  if(desc) parts.push(desc);
  if(nearbyLines.length) parts.push(`📍 生活機能\n${nearbyLines.join('\n')}`);
  parts.push(PT_SIGNOFF);

  ptDraftEl.value = parts.join('\n\n');
  ptUpdatePreview();
  ptCopyStatusEl.textContent = '已用欄位組成文案，可在下方繼續編輯。';
  ptCopyStatusEl.className = 'pt-status ok';
}

function ptFillFields(f){
  ptFieldEls.title.value = f.title || '';
  ptFieldEls.price.value = f.price || '';
  ptFieldEls.landPing.value = f.land_ping || '';
  ptFieldEls.buildPing.value = f.building_ping || '';
  ptFieldEls.layout.value = f.layout || '';
  ptFieldEls.address.value = f.address || '';
  ptFieldEls.desc.value = f.description || '';
}

function ptExtractImageUrls(rawText){
  const urls = new Set();
  for(const m of rawText.matchAll(/!\[[^\]]*\]\((https?:\/\/[^\s\)]+)\)/g)){
    urls.add(m[1]);
  }
  for(const m of rawText.matchAll(/https?:\/\/[^\s"'<>\)]+?\.(?:jpg|jpeg|png|webp)(?:\?[^\s"'<>\)]*)?/gi)){
    urls.add(m[0]);
  }
  return [...urls]
    .filter(u => !/logo|icon|sprite|avatar|favicon/i.test(u))
    .slice(0, 24);
}

function ptRenderPhotoGrid(photos){
  ptCurrentPhotos = photos;
  const step = document.getElementById('ptPhotoStep');
  const grid = document.getElementById('ptPhotoGrid');

  if(!photos.length){
    step.style.display = 'none';
    grid.innerHTML = '';
    return;
  }

  step.style.display = 'block';
  grid.innerHTML = photos.map((url, i) => `
    <div class="pt-photo-thumb" id="pt-photo-${i}">
      <img src="${url}" loading="lazy" onclick="window.open('${url}','_blank')" onerror="this.closest('.pt-photo-thumb').remove()">
      <button class="pt-remove-btn" onclick="ptRemovePhoto(${i})">✕</button>
    </div>
  `).join('');
}

function ptRemovePhoto(i){
  const el = document.getElementById('pt-photo-' + i);
  if(el) el.remove();
}

async function ptFetchReadablePageText(url){
  const readerUrl = 'https://r.jina.ai/' + url;
  const res = await fetch(readerUrl);
  if(!res.ok) throw new Error(`網頁讀取服務回應錯誤 (狀態碼 ${res.status})`);
  const text = await res.text();
  if(!text || text.trim().length < 20) throw new Error('讀取到的網頁內容是空的，該網址可能需要登入或封鎖了自動讀取');
  return text.trim();
}

function ptExtractFieldsWithRegex(rawText){
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
  let title = lines.find(l => l.length > 4 && l.length < 80) || '';
  title = title.replace(/^title\s*[:：]\s*/i, '').trim();

  const priceMatch = rawText.match(/(\d{2,5}(?:\.\d+)?\s*萬)/);

  const landMatch =
    rawText.match(/地坪\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/) ||
    rawText.match(/土地(?:面積|坪數)?\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/);

  const buildMatch =
    rawText.match(/主建\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/) ||
    rawText.match(/建坪\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/) ||
    rawText.match(/(?:主建物|建物面積|權狀坪數|房屋坪數)\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/);

  const layoutMatch =
    rawText.match(/(\d\s*房\s*\d\s*廳\s*\d?\s*衛?)/) ||
    rawText.match(/(\d\s*[房室]\s*\d\s*廳)/) ||
    rawText.match(/格局\s*[:：]?\s*([^\n]{2,12}(?:房|室)[^\n]{0,10})/);

  const addressMatch =
    rawText.match(/地址\s*[:：]?\s*([^\n]{6,40}(?:路|街|大道)[^\n]{0,20}?\d+[^\n]{0,10})/) ||
    rawText.match(/([\u4e00-\u9fa5]{2,3}[縣市][\u4e00-\u9fa5]{2,4}[區鄉鎮市][^\n]{2,20}(?:路|街|大道)[^\n]{0,20}?\d+[^\n]{0,10})/);

  let desc = '';
  const starSections = [...rawText.matchAll(/★\s*(?:房屋)?(?:環境|交通|屋況|特色|格局|介紹)[:：]?\s*([\s\S]{10,300}?)(?=★|\n\n|$)/g)]
    .map(m => m[1].trim())
    .filter(Boolean);
  if(starSections.length){
    desc = starSections.join('\n');
  } else {
    const descHeadMatch = rawText.match(
      /(?:房屋描述|屋況介紹|物件描述|特色描述|物件特色|房屋說明|物件說明|物件亮點|屋況特色|生活機能|仲介口述|心得分享|文案|備註)[:：]?\s*([\s\S]{20,300}?)(?:\n\n|$)/
    );
    if(descHeadMatch){
      desc = descHeadMatch[1].trim();
    } else {
      const paragraphs = rawText.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
      const prose = paragraphs
        .filter(p => p.length > 40 && p.length < 400 && !/^(title|url|source)\s*[:：]/i.test(p))
        .sort((a, b) => b.length - a.length)[0];
      if(prose) desc = prose.slice(0, 300);
    }
  }

  return {
    title,
    price: priceMatch ? priceMatch[1].replace(/\s+/g,'') : '',
    land_ping: landMatch ? landMatch[1].replace(/\s+/g,'') : '',
    building_ping: buildMatch ? buildMatch[1].replace(/\s+/g,'') : '',
    layout: layoutMatch ? layoutMatch[1].replace(/\s+/g,'') : '',
    address: addressMatch ? addressMatch[1].replace(/\s+/g,'') : '',
    description: desc,
  };
}

async function ptExtractFieldsWithAI(rawText, url){
  const trimmed = rawText.slice(0, 6000);
  const prompt = `以下是從房屋物件網頁 ${url} 擷取到的內容：

---
${trimmed}
---

請從中找出以下欄位，找不到的欄位請填空字串，絕對不要編造內容：
- title：物件標題
- price：售價（含「萬」字，例如「888萬」）
- land_ping：地坪（含「坪」字）
- building_ping：建坪（含「坪」字）
- layout：格局（例如「3房2廳2衛」）
- address：完整地址（含縣市、區、路名、門牌），找不到就填空字串，絕對不要編造
- description：房屋描述／屋況／賣點，濃縮成 100-200 字繁體中文

只回傳一個 JSON 物件，不要任何前言、說明或 markdown 符號，格式如下：
{"title":"","price":"","land_ping":"","building_ping":"","layout":"","address":"","description":""}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 800,
      messages: [{ role: "user", content: prompt }]
    })
  });

  if(!response.ok) throw new Error(`AI 擷取服務回應錯誤 (狀態碼 ${response.status})`);
  const data = await response.json();
  if(data.error) throw new Error(data.error.message || 'AI 擷取服務錯誤');

  const text = (data.content || [])
    .map(b => b.type === 'text' ? b.text : '')
    .filter(Boolean)
    .join('\n')
    .trim();

  const cleaned = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(cleaned);
  return parsed;
}

async function ptGenerateDraft(){
  const url = document.getElementById('ptUrlInput').value.trim();
  if(!url){
    ptGenStatusEl.textContent = '請先貼上物件網址';
    ptGenStatusEl.className = 'pt-status err';
    return;
  }
  ptGenBtnEl.disabled = true;
  ptGenStatusEl.innerHTML = '<span class="pt-spinner"></span>正在讀取網頁內容...';
  ptGenStatusEl.className = 'pt-status';

  let rawText;
  try{
    rawText = await ptFetchReadablePageText(url);
  }catch(e){
    console.error(e);
    ptGenStatusEl.textContent = '讀取網頁失敗：' + (e && e.message ? e.message : '未知錯誤') + '。請確認網址正確、頁面公開可瀏覽，或換一個網址再試。';
    ptGenStatusEl.className = 'pt-status err';
    ptGenBtnEl.disabled = false;
    return;
  }

  ptGenStatusEl.innerHTML = '<span class="pt-spinner"></span>網頁已讀取，正在擷取照片與欄位...';

  const photos = ptExtractImageUrls(rawText);
  ptRenderPhotoGrid(photos);

  let fields;
  let usedAI = true;
  try{
    fields = await ptExtractFieldsWithAI(rawText, url);
  }catch(e){
    console.error(e);
    usedAI = false;
    fields = ptExtractFieldsWithRegex(rawText);
  }

  ptFillFields(fields);
  ptComposeFromFields();

  if(usedAI){
    ptGenStatusEl.textContent = '欄位已由 AI 擷取，請在下方確認或補上缺漏的欄位。';
    ptGenStatusEl.className = 'pt-status ok';
  } else {
    ptGenStatusEl.textContent = 'AI 擷取暫時無法使用，已改用關鍵字比對填入欄位，請務必逐一核對、補上缺漏。';
    ptGenStatusEl.className = 'pt-status err';
  }
  ptGenBtnEl.disabled = false;
}

async function ptCopyDraft(){
  const text = ptDraftEl.value.trim();
  if(!text){
    ptCopyStatusEl.textContent = '目前沒有文案可以複製';
    ptCopyStatusEl.className = 'pt-status err';
    return;
  }
  try{
    await navigator.clipboard.writeText(text);
    ptCopyStatusEl.textContent = '已複製，接下來可以貼到社團貼文框。';
    ptCopyStatusEl.className = 'pt-status ok';
  }catch(e){
    ptCopyStatusEl.textContent = '複製失敗，請手動選取文字複製。';
    ptCopyStatusEl.className = 'pt-status err';
  }
}

/* ===================== Calendar Page ===================== */
function renderCalendar(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title"><span class="eyebrow">CALENDAR</span>行事曆</div>
        <div class="page-desc">依日期彙整所有客戶的服務紀錄,點紀錄可直接開啟該客戶</div>
      </div>
      <div class="toolbar" style="margin:0;">
        <button class="btn btn-ghost btn-sm" id="calPrev">‹ 上個月</button>
        <div id="calLabel" style="font-weight:700; padding:0 8px; display:flex; align-items:center; min-width:90px; justify-content:center;"></div>
        <button class="btn btn-ghost btn-sm" id="calNext">下個月 ›</button>
        <button class="btn btn-ghost btn-sm" id="calToday">回到今天</button>
      </div>
    </div>
    <div class="section-block"><div class="section-block-body" id="calGrid" style="padding:0;"></div></div>
  `;
  document.getElementById('calPrev').onclick = ()=>{ calendarMonth.setMonth(calendarMonth.getMonth()-1); drawCalendar(); };
  document.getElementById('calNext').onclick = ()=>{ calendarMonth.setMonth(calendarMonth.getMonth()+1); drawCalendar(); };
  document.getElementById('calToday').onclick = ()=>{ calendarMonth = new Date(); drawCalendar(); };
  drawCalendar();
}

function drawCalendar(){
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  document.getElementById('calLabel').textContent = `${year} 年 ${month+1} 月`;

  const events = {};
  DATA.clients.forEach(c=>{
    (c.serviceLogs||[]).forEach(l=>{
      if(!l.date) return;
      if(!events[l.date]) events[l.date] = [];
      events[l.date].push({clientId:c.id, logId:l.id, clientName:c.name, time:l.time||'', note:l.note||'', completed: !!l.completed});
    });
  });

  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = (events[dateStr]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const isToday = dateStr === todayStr;
    cells += `<div class="cal-cell ${isToday?'cal-today':''}">
      <div class="cal-daynum">${d}</div>
      <div class="cal-events">
        ${dayEvents.map(e=>`<div class="cal-event ${e.completed?'cal-event-done':''}" title="${esc(e.note)}">
          <input type="checkbox" ${e.completed?'checked':''} onclick="event.stopPropagation(); toggleCalendarEventDone('${e.clientId}','${e.logId}')">
          <span onclick="viewClientModal('${e.clientId}')">${e.time?esc(e.time)+' ':''}${esc(e.clientName)}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('calGrid').innerHTML = `
    <div class="cal-weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="cal-grid">${cells}</div>
  `;
}

async function toggleCalendarEventDone(clientId, logId){
  const idx = DATA.clients.findIndex(c=>c.id===clientId);
  if(idx===-1) return;
  const client = DATA.clients[idx];
  const logs = (client.serviceLogs||[]).map(l=> l.id===logId ? {...l, completed: !l.completed} : l);
  DATA.clients[idx] = {...client, serviceLogs:logs};
  await saveType('clients');
  drawCalendar();
}

/* ===================== Modal plumbing ===================== */
function openModal(){
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  editingCtx = null;
}
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalSave').onclick = async ()=>{
  if(!editingCtx) return;
  const saveBtn = document.getElementById('modalSave');
  saveBtn.disabled = true;
  let ok = false;
  if(editingCtx.type==='clients') ok = await saveClient();
  if(editingCtx.type==='greetingCard') ok = await saveGreetingCard();
  if(editingCtx.type==='listings') ok = await saveListing();
  if(editingCtx.type==='content') ok = await saveContent();
  if(editingCtx.type==='deals') ok = await saveDeal();
  saveBtn.disabled = false;
  if(ok){
    showToast('已儲存');
    closeModal();
    render();
  }
};

async function deleteItem(type, id){
  if(!confirm('確定要刪除這筆資料嗎?相關照片也會一併移除。')) return;
  const item = DATA[type].find(x=>x.id===id);
  if(item){
    if(type==='clients' && item.cardPhotoKey) await deletePhoto(item.cardPhotoKey);
    if(type==='clients' && item.attachmentKeys) for(const k of item.attachmentKeys) await deletePhoto(k);
    if(type==='clients' && item.propertyRecords) for(const r of item.propertyRecords) for(const k of (r.photoKeys||[])) await deletePhoto(k);
    if(type==='listings' && item.photoKeys) for(const k of item.photoKeys) await deletePhoto(k);
  }
  DATA[type] = DATA[type].filter(x=>x.id!==id);
  await saveType(type);
  showToast('已刪除');
  render();
}

  await loadAll();

  const hashPage = location.hash.replace('#','');

    currentPage = hashPage;
    document.querySelectorAll('.nav-item').forEach(n=>{
      n.classList.toggle('active', n.dataset.page === hashPage);
    });
  }
  render();
};
