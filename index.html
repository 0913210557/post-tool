<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅慈房產工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#2F4B3C;
    --pine-dark:#1F3329;
    --brass:#A67C42;
    --brass-light:#C79A5F;
    --cream:#F5F1E8;
    --ink:#2A2A26;
    --line:#DED4C0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    line-height:1.6;
  }
  header{
    background:var(--pine);
    color:var(--cream);
    padding:36px 20px 30px;
    text-align:center;
  }
  header h1{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 6px;
    letter-spacing:.04em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:#CFE0D3;
  }
  main{
    max-width:520px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .tool-card{
    display:block;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 16px;
    margin-bottom:14px;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s;
  }
  .tool-card:hover{
    border-color:var(--brass);
  }
  .tool-card-title{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:16px;
    color:var(--pine);
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tool-card-desc{
    font-size:13px;
    color:#6B6355;
    margin:0;
  }
  .tool-icon{
    width:32px;height:32px;
    border-radius:8px;
    background:var(--brass);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex-shrink:0;
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .placeholder{
    border:1px dashed var(--line);
    border-radius:10px;
    padding:18px 16px;
    text-align:center;
    font-size:13px;
    color:#9B927F;
  }
  footer{
    text-align:center;
    font-size:11.5px;
    color:#9B927F;
    padding:20px 16px 30px;
  }
</style>
</head>
<body>

<header>
  <h1>房產好夥伴雅慈 · 工具箱</h1>
</header>

<main>

  <a class="tool-card" href="./post-tool.html">
    <div class="card-head">
      <div class="tool-icon">📝</div>
      <p class="tool-card-title">貼文小工具</p>
    </div>
  </a>


</main>

<footer>房產好夥伴雅慈 · 內部工具，僅供自用</footer>

</body>
</html>
