<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社區資料查詢 | 雅慈房產工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#2F4B3C;
    --pine-dark:#1F3329;
    --brass:#A67C42;
    --brass-light:#C79A5F;
    --cream:#F5F1E8;
    --ink:#2A2A26;
    --line:#DED4C0;
    --danger:#B5502F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    line-height:1.6;
  }
  header{
    background:var(--pine);
    color:var(--cream);
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:.04em;
  }
  a.back{
    display:inline-block;
    color:#CFE0D3;
    font-size:12.5px;
    text-decoration:none;
    margin-bottom:8px;
  }
  main{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .step{
    background:#fff;
    border:1px solid var(--line);
    padding:18px 16px;
    margin-bottom:16px;
  }
  .step-label{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:15px;
    color:var(--pine);
    margin-bottom:10px;
  }
  input[type=text], textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#FAF8F3;
  }
  input:focus, textarea:focus{
    outline:2px solid var(--brass-light);
    outline-offset:1px;
    background:#fff;
  }
  textarea{ min-height:80px; resize:vertical; line-height:1.7; }
  .hint{ font-size:12px; color:#7A7264; margin-top:6px; }
  label.field-label{ display:block; font-size:13px; color:var(--ink); margin:14px 0 6px; font-weight:700; }
  label.field-label:first-of-type{ margin-top:0; }
  button{
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:14px;
    border:none;
    padding:11px 18px;
    cursor:pointer;
  }
  .btn-primary{ background:var(--pine); color:#fff; width:100%; }
  .btn-brass{ background:var(--brass); color:#fff; }
  .btn-outline{ background:transparent; color:var(--pine); border:1px solid var(--pine); }
  .row-buttons{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .row-buttons button{ flex:1; min-width:100px; }
  .status{ font-size:12.5px; margin-top:8px; color:#7A7264; }
  .status.ok{ color:var(--pine); }
  .status.err{ color:var(--danger); }

  .info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .info-cell{
    border:1px solid var(--line);
    padding:10px 12px;
    background:#FAF8F3;
  }
  .info-cell-label{ font-size:11.5px; color:#8A8377; margin-bottom:2px; }
  .info-cell-value{ font-size:15px; font-weight:700; color:var(--pine); }
  .facility-list{
    border:1px solid var(--line);
    padding:12px 14px;
    background:#FAF8F3;
    font-size:14px;
    white-space:pre-wrap;
  }

  .community-list-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .community-list-item .name{ flex:1; cursor:pointer; }
  .community-list-item .name:hover{ color:var(--brass); }
  .community-list-item button{ padding:5px 10px; font-size:11.5px; }
</style>
</head>
<body>

<header>
  <a class="back" href="./index.html">← 回工具箱</a>
  <h1>社區資料查詢</h1>
</header>

<main>

  <div class="step">
    <div class="step-label">查詢 / 新增社區</div>
    <input type="text" id="nameInput" list="communityNames" placeholder="輸入社區名稱">
    <datalist id="communityNames"></datalist>
    <div class="row-buttons">
      <button class="btn-primary" onclick="lookupCommunity()">查詢</button>
    </div>
    <div class="status" id="lookupStatus"></div>
  </div>

  <div class="step" id="viewCard" style="display:none;">
    <div class="step-label" id="viewTitle"></div>
    <div class="info-grid">
      <div class="info-cell">
        <div class="info-cell-label">地上樓層</div>
        <div class="info-cell-value" id="viewAbove">—</div>
      </div>
      <div class="info-cell">
        <div class="info-cell-label">地下樓層</div>
        <div class="info-cell-value" id="viewBelow">—</div>
      </div>
      <div class="info-cell">
        <div class="info-cell-label">垃圾室在幾樓</div>
        <div class="info-cell-value" id="viewTrash">—</div>
      </div>
      <div class="info-cell">
        <div class="info-cell-label">公設在幾樓</div>
        <div class="info-cell-value" id="viewFacilityFloor">—</div>
      </div>
    </div>
    <div class="info-cell-label" style="margin-bottom:6px;">公設有哪些</div>
    <div class="facility-list" id="viewFacilities">—</div>
    <div class="row-buttons">
      <button class="btn-outline" onclick="editCommunity()">編輯這筆資料</button>
    </div>
  </div>

  <div class="step" id="editCard" style="display:none;">
    <div class="step-label" id="editTitle">建立 / 編輯社區資料</div>

    <label class="field-label">地上樓層</label>
    <input type="text" id="fAbove" placeholder="例：15層">

    <label class="field-label">地下樓層</label>
    <input type="text" id="fBelow" placeholder="例：地下3層">

    <label class="field-label">垃圾室在幾樓</label>
    <input type="text" id="fTrash" placeholder="例：B1">

    <label class="field-label">公設在幾樓</label>
    <input type="text" id="fFacilityFloor" placeholder="例：2樓、頂樓">

    <label class="field-label">公設有哪些</label>
    <textarea id="fFacilities" placeholder="一行一項，例：&#10;健身房&#10;閱覽室&#10;交誼廳&#10;游泳池"></textarea>

    <div class="row-buttons">
      <button class="btn-brass" onclick="saveCommunity()">儲存</button>
      <button class="btn-outline" onclick="cancelEdit()">取消</button>
    </div>
    <div class="status" id="saveStatus"></div>
  </div>

  <div class="step">
    <div class="step-label">已建立的社區</div>
    <div id="communityList"></div>
  </div>

</main>

<script>
const STORAGE_KEY = 'yaci-communities';
let communities = {};
let currentName = '';

function loadCommunities(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    communities = raw ? JSON.parse(raw) : {};
  }catch(e){
    communities = {};
  }
}

function saveToStorage(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(communities));
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

function refreshDatalist(){
  const dl = document.getElementById('communityNames');
  dl.innerHTML = Object.keys(communities).map(n => `<option value="${escapeHtml(n)}">`).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderCommunityList(){
  const el = document.getElementById('communityList');
  const names = Object.keys(communities).sort((a,b) => a.localeCompare(b, 'zh-Hant'));
  if(!names.length){
    el.innerHTML = '<div class="hint" style="margin-top:0;">尚未建立任何社區資料</div>';
    return;
  }
  el.innerHTML = names.map(n => `
    <div class="community-list-item">
      <div class="name" onclick="showCommunity('${escapeHtml(n).replace(/'/g,"\\'")}')">${escapeHtml(n)}</div>
      <button class="btn-outline" onclick="deleteCommunity('${escapeHtml(n).replace(/'/g,"\\'")}')">刪除</button>
    </div>
  `).join('');
}

function lookupCommunity(){
  const name = document.getElementById('nameInput').value.trim();
  const status = document.getElementById('lookupStatus');
  if(!name){
    status.textContent = '請先輸入社區名稱';
    status.className = 'status err';
    return;
  }
  if(communities[name]){
    status.textContent = '';
    showCommunity(name);
  } else {
    status.textContent = '尚未建立這個社區的資料，直接在下方填寫並儲存。';
    status.className = 'status';
    startNewCommunity(name);
  }
}

function showCommunity(name){
  currentName = name;
  const c = communities[name];
  if(!c) return;
  document.getElementById('nameInput').value = name;
  document.getElementById('viewTitle').textContent = name;
  document.getElementById('viewAbove').textContent = c.above || '—';
  document.getElementById('viewBelow').textContent = c.below || '—';
  document.getElementById('viewTrash').textContent = c.trash || '—';
  document.getElementById('viewFacilityFloor').textContent = c.facilityFloor || '—';
  document.getElementById('viewFacilities').textContent = c.facilities || '—';
  document.getElementById('viewCard').style.display = 'block';
  document.getElementById('editCard').style.display = 'none';
}

function startNewCommunity(name){
  currentName = name;
  document.getElementById('editTitle').textContent = `建立社區資料：${name}`;
  document.getElementById('fAbove').value = '';
  document.getElementById('fBelow').value = '';
  document.getElementById('fTrash').value = '';
  document.getElementById('fFacilityFloor').value = '';
  document.getElementById('fFacilities').value = '';
  document.getElementById('viewCard').style.display = 'none';
  document.getElementById('editCard').style.display = 'block';
}

function editCommunity(){
  const c = communities[currentName];
  if(!c) return;
  document.getElementById('editTitle').textContent = `編輯社區資料：${currentName}`;
  document.getElementById('fAbove').value = c.above || '';
  document.getElementById('fBelow').value = c.below || '';
  document.getElementById('fTrash').value = c.trash || '';
  document.getElementById('fFacilityFloor').value = c.facilityFloor || '';
  document.getElementById('fFacilities').value = c.facilities || '';
  document.getElementById('viewCard').style.display = 'none';
  document.getElementById('editCard').style.display = 'block';
}

function cancelEdit(){
  document.getElementById('editCard').style.display = 'none';
  if(communities[currentName]){
    showCommunity(currentName);
  }
}

function saveCommunity(){
  if(!currentName){
    const status = document.getElementById('saveStatus');
    status.textContent = '請先在上方輸入社區名稱';
    status.className = 'status err';
    return;
  }
  communities[currentName] = {
    above: document.getElementById('fAbove').value.trim(),
    below: document.getElementById('fBelow').value.trim(),
    trash: document.getElementById('fTrash').value.trim(),
    facilityFloor: document.getElementById('fFacilityFloor').value.trim(),
    facilities: document.getElementById('fFacilities').value.trim(),
  };
  const ok = saveToStorage();
  const status = document.getElementById('saveStatus');
  if(ok){
    status.textContent = '已儲存';
    status.className = 'status ok';
    refreshDatalist();
    renderCommunityList();
    showCommunity(currentName);
  } else {
    status.textContent = '儲存失敗，請再試一次';
    status.className = 'status err';
  }
}

function deleteCommunity(name){
  if(!confirm(`確定要刪除「${name}」的資料嗎？`)) return;
  delete communities[name];
  saveToStorage();
  refreshDatalist();
  renderCommunityList();
  if(currentName === name){
    currentName = '';
    document.getElementById('viewCard').style.display = 'none';
    document.getElementById('editCard').style.display = 'none';
    document.getElementById('nameInput').value = '';
  }
}

loadCommunities();
refreshDatalist();
renderCommunityList();
</script>

</body>
</html>
